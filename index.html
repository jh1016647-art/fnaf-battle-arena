<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Freddy vs Glitch Freddy</title>
  <style>
    :root {
      --bg: #05070b;
      --bg2: #0d1017;
      --gold: #d7b05a;
      --gold2: #9a6c1f;
      --glitch: #69d7ff;
      --glitch2: #5d7dff;
      --red: #ff4a4a;
      --white: #edf3ff;
      --dark: #0b0d11;
      --line: rgba(255,255,255,0.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #arena {
      position: relative;
      width: min(1200px, 96vw);
      height: min(760px, 92vh);
      background: radial-gradient(circle at center, #151b23 0%, #090d12 45%, #030507 100%);
      border: 2px solid #2a3340;
      box-shadow: 0 0 35px rgba(0,0,0,0.85);
      overflow: hidden;
    }

    #sky {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 16, 28, 0.8), rgba(8, 11, 18, 0.2) 50%, rgba(0,0,0,0.6) 100%),
        radial-gradient(circle at center, rgba(135, 145, 180, 0.09), transparent 40%);
    }

    .storm {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          140deg,
          rgba(255,255,255,0.04) 0,
          rgba(255,255,255,0.04) 2px,
          transparent 2px,
          transparent 8px
        );
      opacity: 0.28;
      mix-blend-mode: screen;
    }

    .flash {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.9);
      opacity: 0;
      pointer-events: none;
      animation: flash 3s infinite;
    }

    @keyframes flash {
      0%, 18%, 20%, 22%, 24%, 26%, 100% { opacity: 0; }
      19% { opacity: 0.9; }
      21% { opacity: 0.15; }
      23% { opacity: 0.8; }
      25% { opacity: 0.25; }
    }

    .lightning {
      position: absolute;
      width: 6px;
      height: 180px;
      background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(120,180,255,0.2), transparent 90%);
      box-shadow: 0 0 18px rgba(130,200,255,0.6);
      transform-origin: top center;
      opacity: 0;
      animation: lightning 3.4s infinite ease-in-out;
    }

    .lightning:nth-child(1) { left: 18%; top: 2%; animation-delay: 0.1s; }
    .lightning:nth-child(2) { left: 62%; top: 1%; animation-delay: 0.8s; }
    .lightning:nth-child(3) { left: 74%; top: 6%; animation-delay: 1.5s; }
    .lightning:nth-child(4) { left: 45%; top: 10%; animation-delay: 2.4s; }

    @keyframes lightning {
      0%, 14%, 18%, 100% { opacity: 0; transform: scaleY(0.2); }
      15% { opacity: 1; transform: scaleY(1); }
      16% { opacity: 0.5; transform: scaleY(0.9); }
      17% { opacity: 0.8; transform: scaleY(1.05); }
      18% { opacity: 0; transform: scaleY(0.3); }
    }

    #ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 220px;
      background: linear-gradient(180deg, rgba(15, 18, 22, 0.5), rgba(4, 5, 8, 1));
      border-top: 2px solid rgba(255,255,255,0.08);
    }

    #ground::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.02) 0 2px,
        transparent 2px 18px
      );
      opacity: 0.3;
    }

    #battlefield {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .fighter {
      position: absolute;
      bottom: 80px;
      width: 260px;
      height: 420px;
      transition: transform 0.25s ease, filter 0.25s ease;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.08));
    }

    .fighter .head {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 120px;
      height: 108px;
      border-radius: 18px 18px 22px 22px;
      border: 4px solid #111;
      box-shadow: inset 0 0 16px rgba(255,255,255,0.1);
    }

    .fighter .body {
      position: absolute;
      left: 50%;
      top: 104px;
      transform: translateX(-50%);
      width: 120px;
      height: 140px;
      border-radius: 18px 18px 12px 12px;
      border: 4px solid #111;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.1);
    }

    .fighter .arm, .fighter .leg {
      position: absolute;
      border: 4px solid #111;
      border-radius: 16px;
    }

    .fighter .foot {
      position: absolute;
      bottom: 0;
      width: 44px;
      height: 12px;
      border-radius: 12px;
      background: #0b0d11;
    }

    #golden {
      left: 18%;
      animation: goldenIdle 2.8s infinite ease-in-out;
    }

    #golden .head {
      background: linear-gradient(180deg, #d6c077, #9a7a2c);
    }

    #golden .head::before,
    #golden .head::after {
      content: "";
      position: absolute;
      top: 34px;
      width: 16px;
      height: 18px;
      background: #0e0f0f;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(255,205,90,0.7);
    }

    #golden .head::before { left: 22px; }
    #golden .head::after { right: 22px; }

    #golden .muzzle {
      position: absolute;
      left: 50%;
      top: 68px;
      transform: translateX(-50%);
      width: 68px;
      height: 22px;
      background: linear-gradient(180deg, #d5c37f, #90742d);
      border: 4px solid #111;
      border-radius: 14px;
    }

    #golden .body {
      background: linear-gradient(180deg, #d9d9d7, #a5a6a2);
    }

    #golden .body::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 18px;
      width: 52px;
      height: 58px;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.08);
      border-radius: 8px;
    }

    #golden .arm.left {
      left: 40px;
      top: 122px;
      width: 18px;
      height: 98px;
      transform: rotate(18deg);
      background: linear-gradient(180deg, #d8d7d3, #a6a5a2);
    }

    #golden .arm.right {
      right: 40px;
      top: 122px;
      width: 18px;
      height: 98px;
      transform: rotate(-18deg);
      background: linear-gradient(180deg, #d8d7d3, #a6a5a2);
    }

    #golden .leg.left {
      left: 58px;
      top: 216px;
      width: 18px;
      height: 96px;
      transform: rotate(8deg);
      background: linear-gradient(180deg, #d8d7d3, #a6a5a2);
    }

    #golden .leg.right {
      right: 58px;
      top: 216px;
      width: 18px;
      height: 96px;
      transform: rotate(-8deg);
      background: linear-gradient(180deg, #d8d7d3, #a6a5a2);
    }

    #golden .foot.left { left: 42px; }
    #golden .foot.right { right: 42px; }

    #glitch {
      right: 18%;
      animation: glitchIdle 2.3s infinite ease-in-out;
    }

    #glitch .head {
      background: linear-gradient(180deg, #6fd8ff, #486ae6);
      box-shadow: inset 0 0 14px rgba(255,255,255,0.14), 0 0 16px rgba(105, 215, 255, 0.3);
    }

    #glitch .head::before,
    #glitch .head::after {
      content: "";
      position: absolute;
      top: 32px;
      width: 14px;
      height: 18px;
      background: #061015;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(83,219,255,0.7);
    }

    #glitch .head::before { left: 20px; }
    #glitch .head::after { right: 20px; }

    #glitch .body {
      background: linear-gradient(180deg, #4fdcff, #3f4dcb);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.12), 0 0 16px rgba(81, 150, 255, 0.24);
    }

    #glitch .arm.left,
    #glitch .arm.right,
    #glitch .leg.left,
    #glitch .leg.right {
      background: linear-gradient(180deg, #74dfff, #4a69db);
    }

    #glitch .muzzle {
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      width: 70px;
      height: 24px;
      background: linear-gradient(180deg, #9aeaff, #4d6de3);
      border: 4px solid #111;
      border-radius: 14px;
    }

    #glitch .body::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 20px;
      width: 52px;
      height: 58px;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.13);
      border-radius: 8px;
    }

    @keyframes goldenIdle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }

    @keyframes glitchIdle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1.8deg); }
    }

    .attackBar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 70vw);
      height: 18px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.45);
      overflow: hidden;
      z-index: 12;
    }

    .attackBar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(131, 194, 255, 0.2), rgba(255, 255, 255, 0.06));
    }

    .attackBar .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, rgba(255,255,255,0.2), rgba(255, 210, 90, 0.95), rgba(255, 125, 125, 0.9));
      box-shadow: 0 0 16px rgba(255, 197, 85, 0.5);
      animation: powerPulse 2.1s infinite ease-in-out;
    }

    @keyframes powerPulse {
      0%, 100% { width: 35%; }
      50% { width: 68%; }
    }

    .impact {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.06);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }

    .impact.show {
      animation: boom 0.7s ease-out forwards;
    }

    @keyframes boom {
      0% { transform: scale(0.2); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .effectText {
      position: absolute;
      left: 50%;
      top: 25%;
      transform: translateX(-50%);
      font-size: 30px;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: bold;
      color: rgba(255,255,255,0.75);
      opacity: 0;
      z-index: 16;
      text-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    .effectText.show {
      animation: textFlash 1s ease-out forwards;
    }

    @keyframes textFlash {
      0% { opacity: 0; transform: translateX(-50%) scale(0.7); }
      20% { opacity: 1; transform: translateX(-50%) scale(1.08); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.3); }
    }

    .signature {
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="arena">
    <div class="signature">Golden Freddy vs Glitch Freddy</div>
    <div id="sky"></div>
    <div class="storm"></div>
    <div class="flash"></div>
    <div class="lightning"></div>
    <div class="lightning"></div>
    <div class="lightning"></div>
    <div class="lightning"></div>

    <div id="ground"></div>

    <div id="battlefield">
      <div id="golden" class="fighter">
        <div class="head"></div>
        <div class="muzzle"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="foot left"></div>
        <div class="foot right"></div>
      </div>

      <div id="glitch" class="fighter">
        <div class="head"></div>
        <div class="muzzle"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="foot left"></div>
        <div class="foot right"></div>
      </div>
    </div>

    <div id="effectText" class="effectText">BATTLE!</div>
    <div id="impact1" class="impact"></div>
    <div id="impact2" class="impact"></div>

    <div class="attackBar"><div class="fill"></div></div>
  </div>

  <script>
    const golden = document.getElementById('golden');
    const glitch = document.getElementById('glitch');
    const text = document.getElementById('effectText');
    const impact1 = document.getElementById('impact1');
    const impact2 = document.getElementById('impact2');

    function triggerEffect(x, y, label, color) {
      const effect = document.createElement('div');
      effect.className = 'impact';
      effect.style.left = x + 'px';
      effect.style.top = y + 'px';
      effect.style.borderColor = color;
      effect.style.boxShadow = '0 0 16px ' + color;
      document.getElementById('arena').appendChild(effect);
      effect.classList.add('show');
      setTimeout(() => effect.remove(), 700);

      text.textContent = label;
      text.style.color = color;
      text.classList.remove('show');
      void text.offsetWidth;
      text.classList.add('show');
    }

    function animateBattle() {
      golden.style.transform = 'translateX(12px) rotate(4deg)';
      glitch.style.transform = 'translateX(-10px) rotate(-3deg)';

      setTimeout(() => {
        golden.style.transform = 'translateX(-18px) rotate(-5deg)';
        glitch.style.transform = 'translateX(16px) rotate(4deg)';
      }, 250);

      setTimeout(() => {
        golden.style.transform = 'translateX(0px) rotate(0deg)';
        glitch.style.transform = 'translateX(0px) rotate(0deg)';
      }, 500);
    }

    setInterval(() => {
      animateBattle();
      triggerEffect(360, 280, 'CLASH!', 'rgba(255, 213, 100, 0.9)');
      setTimeout(() => {
        triggerEffect(760, 300, 'GLITCH!', 'rgba(105, 215, 255, 0.9)');
      }, 200);
    }, 2200);

    setInterval(() => {
      const flash = document.querySelector('.flash');
      flash.style.opacity = Math.random() > 0.7 ? '0.8' : '0.2';
      setTimeout(() => { flash.style.opacity = '0'; }, 120);
    }, 900);
  </script>
</body>
</html>
